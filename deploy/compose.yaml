services:
  mobilemcp-hub:
    build:
      context: .
      args:
        TARBALL: ${MOBILEMCP_TARBALL:-mobilemcp-0.1.0.tgz}
    container_name: mobilemcp-hub
    restart: unless-stopped
    ports:
      - "17692:17692"
    environment:
      MOBILEMCP_PUBLIC_URL: ${MOBILEMCP_PUBLIC_URL}
      MOBILEMCP_TOKEN: ${MOBILEMCP_TOKEN}
      MOBILEMCP_APK: /app/mobilemcp.apk
    volumes:
      # Optional: serve the app at GET /app.apk?token=<device token> so phones can self-update.
      - ./mobilemcp.apk:/app/mobilemcp.apk:ro
